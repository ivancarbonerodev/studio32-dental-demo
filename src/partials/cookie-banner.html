<!-- Banner de cookies: Plausible no se carga hasta pulsar "Aceptar" (src/consent.js). Aceptar y Rechazar tienen el mismo peso visual. -->
<div x-data="cookieBanner()" x-show="visible" x-cloak role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-desc"
     class="fixed inset-x-3 bottom-3 sm:inset-x-auto sm:left-6 sm:bottom-6 sm:max-w-md z-[60] bg-ink text-white rounded-2xl shadow-2xl p-5 border border-white/15">
  <p id="cookie-title" class="font-display font-semibold flex items-center gap-2"><i data-lucide="cookie" class="w-5 h-5 text-mint"></i>Cookies y analítica</p>
  <p id="cookie-desc" class="text-sm text-white/80 mt-2">Usamos almacenamiento técnico imprescindible para que la web funcione y, solo si lo aceptas, analítica anónima (Plausible) para mejorar el sitio. Puedes cambiar tu decisión en cualquier momento desde el pie de página. <a href="/cookies" class="underline text-mint">Ver política de cookies</a>.</p>
  <div class="mt-4 grid grid-cols-2 gap-3">
    <button type="button" @click="reject()" class="min-h-[44px] rounded-xl font-bold bg-white text-ink hover:bg-white/90 transition">Rechazar</button>
    <button type="button" @click="accept()" class="min-h-[44px] rounded-xl font-bold bg-mint text-ink hover:bg-mint-dark transition">Aceptar</button>
  </div>
</div>
